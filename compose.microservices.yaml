# Docker Compose for Microservices Architecture
# Lab 7 — API Gateway, Service Discovery & Cloud Deployment
# Web Services & SOA Laboratory — Dhirubhai Ambani University
#
# Lab 7 Key Requirement: ONLY the API Gateway port (3000) is exposed externally.
# User, Product and Order services are reachable ONLY from within the Docker
# network (campus-network) — not from the host machine or the internet.
# Clients MUST go through the gateway; direct service access is blocked.

services:

  # ── API Gateway (Public Entry Point) ─────────────────────────────────────
  # The ONLY service with an exposed port.  All client traffic enters here.
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    container_name: campus-gateway
    ports:
      - "3001:3000"          # ← ONLY externally exposed port in the stack (host:3001 → container:3000)
    environment:
      - PORT=3000
      # Service Registry — config-based service discovery (Lab 7 Part B)
      # Change only these values to reroute the gateway; no code edits needed.
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── User Service (Internal Only) ─────────────────────────────────────────
  # No 'ports:' mapping — reachable only via campus-network inside Docker.
  user-service:
    build:
      context: ./microservices/user-service
      dockerfile: Dockerfile
    container_name: user-service
    # NO ports exposed externally — internal Docker network only (Lab 7)
    environment:
      - PORT=3001
    networks:
      - campus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Product Service (Internal Only) ──────────────────────────────────────
  product-service:
    build:
      context: ./microservices/product-service
      dockerfile: Dockerfile
    container_name: product-service
    # NO ports exposed externally — internal Docker network only (Lab 7)
    environment:
      - PORT=3002
    networks:
      - campus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Order Service (Internal Only) ─────────────────────────────────────────
  order-service:
    build:
      context: ./microservices/order-service
      dockerfile: Dockerfile
    container_name: order-service
    # NO ports exposed externally — internal Docker network only (Lab 7)
    environment:
      - PORT=3003
      # Order service also uses config-based discovery for its upstream calls
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
    depends_on:
      - user-service
      - product-service
    networks:
      - campus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── Network ────────────────────────────────────────────────────────────────
networks:
  campus-network:
    name: campus-network
    driver: bridge
    # All services share this network; only the gateway bridges to the host
