apiVersion: v1
kind: Secret
metadata:
  name: campusconnect-secret
  namespace: lab8
  labels:
    app.kubernetes.io/name: campusconnect
    app.kubernetes.io/part-of: ws-soa-lab8
type: Opaque
stringData:
  # Sensitive Database Connection String (Template placeholder - override in deployment)
  MONGODB_URI: "mongodb+srv://<USERNAME>:<PASSWORD>@<CLUSTER>.mongodb.net/campusconnect_db?retryWrites=true&w=majority"
  JWT_SECRET: "your-super-secret-jwt-token-key-change-in-production"
