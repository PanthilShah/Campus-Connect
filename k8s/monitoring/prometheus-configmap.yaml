apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app: prometheus
    lab: "8"
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'api-gateway'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['api-gateway.lab8.svc.cluster.local:3000']
            labels:
              app: 'api-gateway'
              environment: 'k8s-lab8'

      - job_name: 'user-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['user-service.lab8.svc.cluster.local:3001']
            labels:
              app: 'user-service'
              environment: 'k8s-lab8'

      - job_name: 'product-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['product-service.lab8.svc.cluster.local:3002']
            labels:
              app: 'product-service'
              environment: 'k8s-lab8'

      - job_name: 'order-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['order-service.lab8.svc.cluster.local:3003']
            labels:
              app: 'order-service'
              environment: 'k8s-lab8'
