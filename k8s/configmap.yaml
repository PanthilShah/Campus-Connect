apiVersion: v1
kind: ConfigMap
metadata:
  name: campusconnect-config
  namespace: lab8
  labels:
    app.kubernetes.io/name: campusconnect
    app.kubernetes.io/part-of: ws-soa-lab8
data:
  NODE_ENV: "production"
  PORT: "3000"
  USER_PORT: "3001"
  PRODUCT_PORT: "3002"
  ORDER_PORT: "3003"
  # Service Discovery via Kubernetes Internal DNS Names (Lab 8 Part A)
  USER_SERVICE_URL: "http://user-service.lab8.svc.cluster.local:3001"
  PRODUCT_SERVICE_URL: "http://product-service.lab8.svc.cluster.local:3002"
  ORDER_SERVICE_URL: "http://order-service.lab8.svc.cluster.local:3003"
